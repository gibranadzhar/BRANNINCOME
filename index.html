<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack Pro - Ultimate Stable</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0f19; color: #f1f5f9; padding: 20px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Layout Grid Dasar Manual Tanpa Tailwind */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-b: 1px solid #1e293b; margin-bottom: 25px; }
        h1 { font-size: 24px; color: #818cf8; font-weight: 700; }
        .pro-badge { background: linear-gradient(90deg, #fbbf24, #f59e0b); color: #020617; font-size: 10px; padding: 2px 6px; rounded-radius: 10px; border-radius: 20px; margin-left: 5px; font-weight: bold; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 16px; backdrop-filter: blur(10px); }
        .card p { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
        .card h3 { font-size: 22px; margin-top: 8px; font-weight: 700; }
        
        .wallets-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .wallet-box { background: rgba(15, 23, 42, 0.6); border: 1px solid #1e293b; padding: 12px; border-radius: 12px; text-align: center; font-size: 13px; }
        
        .main-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .main-layout { grid-template-columns: 320px 1fr; } }
        
        /* Form & Input Styles */
        .form-group { display: flex; flex-direction: column; gap: 10px; }
        select, input { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 10px 12px; border-radius: 10px; color: #fff; font-size: 13px; outline: none; }
        button.btn-submit { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 5px; }
        
        /* Shortcut buttons */
        .quick-box { display: flex; gap: 5px; margin-top: 4px; }
        .quick-box button { background: #1e293b; border: none; color: #cbd5e1; font-size: 10px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
        
        /* Table Styles */
        .table-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { padding: 10px; color: #94a3b8; border-b: 1px solid #334155; font-weight: 600; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(51,65,85,0.4); }
        
        .text-green { color: #10b981; }
        .text-red { color: #f43f5e; }
        
        /* Top Utility Bar */
        .table-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .search-filters { display: flex; gap: 8px; }
        .search-filters input, .search-filters select { width: auto; padding: 6px 12px; }
        
        /* Reset & Export Buttons */
        .btn-action { background: #1e293b; border: 1px solid #334155; color: #818cf8; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .btn-reset { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); color: #f43f5e; margin-top: 15px; padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        
        /* SVG Donut Chart */
        .chart-container { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 15px; flex-wrap: wrap; }
        .svg-donut { transform: rotate(-90deg); }
    </style>
</head>
<body>
    <div class="container">
        
        <header>
            <div>
                <h1><i class="fa-solid fa-vault"></i> FinTrack<span class="pro-badge">PRO</span></h1>
            </div>
            <button onclick="exportCSV()" class="btn-action"><i class="fa-solid fa-file-csv"></i> Unduh CSV</button>
        </header>

        <div class="stats-grid">
            <div class="card">
                <p>Total Saldo</p>
                <h3 id="val-balance" style="color: #fff;">Rp 0</h3>
            </div>
            <div class="card">
                <p style="color: #10b981;">Pemasukan</p>
                <h3 id="val-income" class="text-green">+ Rp 0</h3>
            </div>
            <div class="card" id="card-expense">
                <p style="color: #f43f5e;">Pengeluaran</p>
                <h3 id="val-expense" class="text-red">- Rp 0</h3>
            </div>
        </div>

        <div class="wallets-grid">
            <div class="wallet-box">💵 Tunai: <strong id="w-cash">Rp 0</strong></div>
            <div class="wallet-box">🏛️ Bank: <strong id="w-bank">Rp 0</strong></div>
            <div class="wallet-box">📱 E-Wallet: <strong id="w-wallet">Rp 0</strong></div>
        </div>

        <div class="main-layout">
            
            <div class="card">
                <h4 style="font-size: 14px; margin-bottom: 12px;"><i class="fa-solid fa-plus-circle"></i> Catat Transaksi</h4>
                <form id="form-tx" onsubmit="addTx(event)" class="form-group">
                    <select id="tx-type">
                        <option value="income">🟢 Pemasukan (+)</option>
                        <option value="expense">🔴 Pengeluaran (-)</option>
                    </select>
                    
                    <select id="tx-wallet-select">
                        <option value="cash">💵 Uang Tunai</option>
                        <option value="bank">🏛️ Rekening Bank</option>
                        <option value="wallet">📱 E-Wallet / QRIS</option>
                    </select>

                    <div>
                        <input type="number" id="tx-amount" required placeholder="Nominal (Rp)">
                        <div class="quick-box">
                            <button type="button" onclick="quickAmount(20000)">+20k</button>
                            <button type="button" onclick="quickAmount(50000)">+50k</button>
                            <button type="button" onclick="quickAmount(100000)">+100k</button>
                            <button type="button" onclick="quickAmount(0, true)" style="color:#f43f5e;">Clear</button>
                        </div>
                    </div>

                    <input type="text" id="tx-cat" required placeholder="Kategori (Makan, Gaji)">
                    
                    <button type="submit" class="btn-submit">Simpan Transaksi</button>
                </form>
            </div>

            <div style="display: flex; flex-direction: column; gap: 20px;">
                
                <div class="card chart-container">
                    <svg width="120" height="120" class="svg-donut">
                        <circle cx="60" cy="60" r="45" fill="transparent" stroke="#1e293b" stroke-width="16"/>
                        <circle id="slice-income" cx="60" cy="60" r="45" fill="transparent" stroke="#10b981" stroke-width="16" stroke-dasharray="282.7" stroke-dashoffset="282.7"/>
                        <circle id="slice-expense" cx="60" cy="60" r="45" fill="transparent" stroke="#f43f5e" stroke-width="16" stroke-dasharray="282.7" stroke-dashoffset="282.7"/>
                    </svg>
                    <div>
                        <h4 style="font-size: 15px; margin-bottom: 5px;">Proporsi Grafik Keuangan</h4>
                        <p style="font-size: 11px; text-transform:none;">Warna <span class="text-green">Hijau (Masuk)</span> dan <span class="text-red">Merah (Keluar)</span>.</p>
                        <button onclick="clearData()" class="btn-reset"><i class="fa-regular fa-trash-can"></i> Hapus & Reset Semua Data</button>
                    </div>
                </div>

                <div class="card">
                    <div class="table-header">
                        <h4 style="font-size: 14px;"><i class="fa-solid fa-list-ul"></i> Riwayat Terakhir</h4>
                        <div class="search-filters">
                            <input type="text" id="search-tx" oninput="updateUI()" placeholder="🔍 Cari kategori...">
                            <select id="filter-type" onchange="updateUI()">
                                <option value="all">Semua Tipe</option>
                                <option value="income">🟢 Masuk</option>
                                <option value="expense">🔴 Keluar</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Tanggal</th>
                                    <th>Dompet</th>
                                    <th>Tipe</th>
                                    <th>Kategori</th>
                                    <th>Nominal</th>
                                    <th style="text-align: center;">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="history-body"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Data Handling murni mandiri
        let txs = [];
        try {
            txs = JSON.parse(localStorage.getItem('fintrack_data_v2')) || [];
        } catch(e) {
            txs = [];
        }

        const fmtRp = (num) => "Rp " + Number(num).toLocaleString('id-ID');

        function quickAmount(val, clear = false) {
            const input = document.getElementById('tx-amount');
            if (clear) input.value = '';
            else input.value = (Number(input.value) || 0) + val;
        }

        function addTx(e) {
            e.preventDefault();
            const type = document.getElementById('tx-type').value;
            const wallet = document.getElementById('tx-wallet-select').value;
            const amount = parseInt(document.getElementById('tx-amount').value) || 0;
            const cat = document.getElementById('tx-cat').value;
            const dateStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

            if (amount > 0) {
                txs.push({ id: Date.now(), type, wallet, amount, cat, date: dateStr });
                localStorage.setItem('fintrack_data_v2', JSON.stringify(txs));
                document.getElementById('form-tx').reset();
                updateUI();
            } else {
                alert("Masukkan nominal angka murni di atas 0!");
            }
        }

        function deleteTx(id) {
            txs = txs.filter(tx => tx.id !== id);
            localStorage.setItem('fintrack_data_v2', JSON.stringify(txs));
            updateUI();
        }

        function clearData() {
            if (confirm("Bersihkan memori lama dan set ulang aplikasi?")) {
                txs = [];
                localStorage.setItem('fintrack_data_v2', '[]');
                updateUI();
            }
        }

        function exportCSV() {
            if (txs.length === 0) return alert("Data kosong.");
            let csv = "Tanggal,Dompet,Tipe,Kategori,Nominal\n";
            txs.forEach(t => {
                csv += `${t.date || '-'},${t.wallet},${t.type},"${t.cat}",${t.amount}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "Laporan_FinTrack.csv");
            link.click();
        }

        function updateUI() {
            let inc = 0, exp = 0;
            let wBalances = { cash: 0, bank: 0, wallet: 0 };
            
            const tbody = document.getElementById('history-body');
            const filterType = document.getElementById('filter-type').value;
            const searchQuery = document.getElementById('search-tx').value.toLowerCase();
            tbody.innerHTML = '';

            // Hitung akumulasi
            txs.forEach(tx => {
                let w = tx.wallet || 'cash';
                let amt = Number(tx.amount) || 0;

                if (tx.type === 'income') {
                    inc += amt;
                    wBalances[w] += amt;
                } else {
                    exp += amt;
                    wBalances[w] -= amt;
                }
            });

            // Tampilkan baris tabel
            txs.slice().reverse().forEach(tx => {
                if (filterType !== 'all' && tx.type !== filterType) return;
                if (searchQuery && !tx.cat.toLowerCase().includes(searchQuery)) return;

                const lbl = tx.wallet === 'bank' ? '🏛️ Bank' : tx.wallet === 'wallet' ? '📱 E-Wallet' : '💵 Tunai';
                const isInc = tx.type === 'income';

                tbody.innerHTML += `
                    <tr style="color: #fff;">
                        <td style="opacity:0.7;">${tx.date || '-'}</td>
                        <td><strong>${lbl}</strong></td>
                        <td>${isInc ? '<span class="text-green">💵 Masuk</span>' : '<span class="text-red">💸 Keluar</span>'}</td>
                        <td>${tx.cat}</td>
                        <td><strong class="${isInc ? 'text-green' : 'text-red'}">${fmtRp(tx.amount)}</strong></td>
                        <td style="text-align:center;">
                            <button onclick="deleteTx(${tx.id})" style="background:none; border:none; color:#f43f5e; cursor:pointer;"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>
                `;
            });

            // Update Angka di Layar
            document.getElementById('val-balance').innerText = fmtRp(inc - exp);
            document.getElementById('val-income').innerText = "+ " + fmtRp(inc);
            document.getElementById('val-expense').innerText = "- " + fmtRp(exp);

            document.getElementById('w-cash').innerText = fmtRp(wBalances.cash);
            document.getElementById('w-bank').innerText = fmtRp(wBalances.bank);
            document.getElementById('w-wallet').innerText = fmtRp(wBalances.wallet);

            // Perbarui grafik lingkaran SVG Murni (Keliling Lingkaran r=45 adalah ~282.7)
            const total = inc + exp;
            const incSlice = document.getElementById('slice-income');
            const expSlice = document.getElementById('slice-expense');
            
            if (total === 0) {
                incSlice.setAttribute('stroke-dashoffset', 282.7);
                expSlice.setAttribute('stroke-dashoffset', 282.7);
            } else {
                const incPercent = inc / total;
                const incOffset = 282.7 - (282.7 * incPercent);
                incSlice.setAttribute('stroke-dashoffset', incOffset);
                
                const expPercent = exp / total;
                const expOffset = 282.7 - (282.7 * expPercent);
                expSlice.setAttribute('stroke-dashoffset', expOffset);
                expSlice.setAttribute('stroke-dasharray', `282.7`);
                // rotasi pergeseran posisi pengeluaran agar menyambung pemasukan
                expSlice.style.transform = `rotate(${incPercent * 360 - 90}deg)`;
                expSlice.style.transformOrigin = "60px 60px";
            }
        }

        // Jalankan UI pertama kali
        updateUI();
    </script>
</body>
</html>
