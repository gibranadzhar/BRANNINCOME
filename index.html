<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrannTrack | Elite Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --accent: #6366f1; --bg: #0a0a0c; --glass: rgba(255, 255, 255, 0.04); }
        body { background: var(--bg); color: #e2e8f0; font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .app { width: 100%; max-width: 450px; }
        .panel { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 25px; margin-bottom: 20px; }
        
        h1 { font-size: 16px; letter-spacing: 4px; text-align: center; color: #fff; margin-bottom: 25px; }
        .val { font-size: 32px; font-weight: 700; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .card { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 16px; text-align: center; font-size: 10px; }
        
        input, select, button { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.03); color: white; }
        button { background: var(--accent); border: none; font-weight: 600; cursor: pointer; }
        button.secondary { background: transparent; border: 1px solid #333; }
        
        .history { max-height: 300px; overflow-y: auto; font-size: 13px; }
        .item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="app">
    <h1>BRANNTRACK</h1>

    <!-- Stats Panel -->
    <div class="panel">
        <div style="font-size: 10px; text-align: center; opacity: 0.6; margin-bottom: 5px;">TOTAL SALDO</div>
        <div class="val" id="total-saldo">Rp 0</div>
        <div class="grid">
            <div class="card">💵 Tunai<br><b id="w-cash">0</b></div>
            <div class="card">🏛️ Bank<br><b id="w-bank">0</b></div>
            <div class="card">📱 E-Wallet<br><b id="w-wallet">0</b></div>
        </div>
    </div>

    <!-- Chart Panel -->
    <div class="panel"><canvas id="myChart"></canvas></div>

    <!-- Input Panel -->
    <div class="panel">
        <input type="date" id="in-date">
        <input type="text" id="search" placeholder="🔍 Cari transaksi..." onkeyup="render()">
        <select id="in-tipe"><option value="masuk">🟢 Masuk</option><option value="keluar">🔴 Keluar</option></select>
        <select id="in-wadah"><option value="cash">💵 Tunai</option><option value="bank">🏛️ Bank</option><option value="wallet">📱 E-Wallet</option></select>
        <input type="number" id="in-nom" placeholder="Nominal">
        <input type="text" id="in-ket" placeholder="Keterangan">
        <button onclick="addTx()">SIMPAN TRANSAKSI</button>
        <button class="secondary" onclick="copyToAca()">📋 Salin untuk Aca</button>
        <button class="secondary" style="border-color:#7f1d1d;" onclick="resetAll()">Reset Semua Data</button>
    </div>

    <div class="panel history" id="tbl-body"></div>
</div>

<script>
    let txs = JSON.parse(localStorage.getItem('brann_elite')) || [];
    let myChart;

    function vibrate() { if(navigator.vibrate) navigator.vibrate(50); }

    function addTx() {
        vibrate();
        const nom = parseInt(document.getElementById('in-nom').value);
        const tipe = document.getElementById('in-tipe').value;
        const wadah = document.getElementById('in-wadah').value;
        
        let s = {cash:0, bank:0, wallet:0};
        txs.forEach(t => s[t.wadah] += (t.tipe === 'masuk' ? t.nominal : -t.nominal));
        if (tipe === 'keluar' && nom > s[wadah]) return alert("⚠️ Saldo tidak cukup!");

        txs.push({tipe, wadah, nominal: nom, ket: document.getElementById('in-ket').value, date: document.getElementById('in-date').value || new Date().toISOString().split('T')[0]});
        localStorage.setItem('brann_elite', JSON.stringify(txs));
        render();
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const body = document.getElementById('tbl-body');
        body.innerHTML = '';
        let total = 0, s = {cash:0, bank:0, wallet:0};
        
        txs.slice().reverse().forEach((t, i) => {
            if(t.ket.toLowerCase().includes(query)) {
                total += (t.tipe === 'masuk' ? t.nominal : -t.nominal);
                s[t.wadah] += (t.tipe === 'masuk' ? t.nominal : -t.nominal);
                body.innerHTML += `<div class="item">
                    <div><b>${t.ket}</b><br><small>${t.date} • ${t.wadah}</small></div>
                    <div style="color:${t.tipe==='masuk'?'#10b981':'#f43f5e'}">${t.tipe==='masuk'?'+':'-'}${t.nominal.toLocaleString()}</div>
                </div>`;
            }
        });
        document.getElementById('total-saldo').innerText = "Rp " + total.toLocaleString();
        document.getElementById('w-cash').innerText = s.cash.toLocaleString();
        document.getElementById('w-bank').innerText = s.bank.toLocaleString();
        document.getElementById('w-wallet').innerText = s.wallet.toLocaleString();
        updateChart([s.cash, s.bank, s.wallet]);
    }

    function updateChart(data) {
        const ctx = document.getElementById('myChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Tunai', 'Bank', 'E-Wallet'], datasets: [{ data: data, backgroundColor: ['#3b82f6', '#8b5cf6', '#ec4899'] }] } });
    }

    function copyToAca() { 
        let text = "Ringkasan Keuangan:\n" + txs.map(t => `${t.date}: ${t.ket} - Rp ${t.nominal}`).join("\n");
        navigator.clipboard.writeText(text); alert("Tersalin!"); 
    }
    function resetAll() { if(confirm("Reset semua data?")) { txs = []; localStorage.setItem('brann_elite', '[]'); render(); } }
    render();
</script>
</body>
</html>
