<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack Pro - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617); }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="text-slate-100 min-h-screen antialiased">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-800/60 pb-6">
            <div>
                <div class="flex items-center gap-3">
                    <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-vault text-white text-lg"></i>
                    </div>
                    <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">FinTrack<span class="text-xs font-semibold ml-1 px-2 py-0.5 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 rounded-full">PRO</span></h1>
                </div>
                <p class="text-slate-400 text-sm mt-2">Ringkasan Keuangan Gabungan</p>
            </div>
            <button onclick="exportToCSV()" class="bg-slate-800/80 hover:bg-slate-700 text-indigo-400 border border-indigo-500/30 px-4 py-2.5 rounded-xl text-sm font-semibold cursor-pointer">
                <i class="fa-solid fa-file-arrow-down"></i> Rekap CSV
            </button>
        </header>

        <!-- Menu Navigasi Antar Halaman Terpisah -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
            <a href="index.html" class="p-4 rounded-xl text-sm font-bold flex items-center justify-center gap-2 bg-slate-800 text-white border border-slate-700 shadow-md">
                <i class="fa-solid fa-layer-group"></i> Ringkasan
            </a>
            <a href="cash.html" class="p-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 bg-slate-900/50 text-slate-400 hover:text-white border border-slate-800/60 hover:border-slate-700 transition-all">
                💵 Uang Tunai
            </a>
            <a href="bank.html" class="p-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 bg-slate-900/50 text-slate-400 hover:text-white border border-slate-800/60 hover:border-slate-700 transition-all">
                🏛️ Rekening Bank
            </a>
            <a href="ewallet.html" class="p-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 bg-slate-900/50 text-slate-400 hover:text-white border border-slate-800/60 hover:border-slate-700 transition-all">
                📱 E-Wallet
            </a>
        </div>

        <!-- Dashboard Angka -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-card rounded-2xl p-6">
                <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-indigo-400"></span>Total Saldo Bersih</p>
                <h3 id="total-balance" class="text-3xl font-bold mt-3 text-white">Rp 0</h3>
            </div>
            <div class="glass-card rounded-2xl p-6 border-emerald-500/10">
                <p class="text-emerald-400 text-xs font-semibold uppercase tracking-wider flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-emerald-400"></span>Total Pemasukan</p>
                <h3 id="total-income" class="text-3xl font-bold mt-3 text-emerald-400">+ Rp 0</h3>
            </div>
            <div class="glass-card rounded-2xl p-6 border-rose-500/10">
                <p class="text-rose-400 text-xs font-semibold uppercase tracking-wider flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-rose-400"></span>Total Pengeluaran</p>
                <h3 id="total-expense" class="text-3xl font-bold mt-3 text-rose-400">- Rp 0</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form Input Catatan -->
            <div class="glass-card rounded-2xl p-6 h-fit">
                <h2 class="text-xl font-bold mb-4 text-white">Tambah Catatan</h2>
                <form id="tx-form" onsubmit="addTransaction(event)" class="space-y-3.5">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Jenis</label>
                            <select id="tx-type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white">
                                <option value="income">🟢 Masuk (+)</option>
                                <option value="expense">🔴 Keluar (-)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Tujuan Dompet</label>
                            <select id="tx-wallet" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white">
                                <option value="cash">💵 Uang Tunai (Cash)</option>
                                <option value="bank">🏛️ Rekening Bank</option>
                                <option value="ewallet">📱 E-Wallet / QRIS</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Nominal (Rp)</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-2.5 text-slate-500 text-sm font-semibold">Rp</span>
                            <input type="number" id="tx-amount" required placeholder="100000" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-3.5 py-2.5 text-sm text-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Kategori</label>
                        <input type="text" id="tx-category" required placeholder="Makanan, Gaji, dll" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-bold py-3 rounded-xl text-xs cursor-pointer">Simpan Transaksi</button>
                </form>
            </div>

            <!-- Chart & Info Mini -->
            <div class="lg:col-span-2 glass-card rounded-2xl p-6 flex flex-col items-center justify-center gap-6">
                <h2 class="text-xl font-bold text-white self-start">Struktur Analisis Keseluruhan</h2>
                <div class="w-48 h-48"><canvas id="financeChart"></canvas></div>
                <button onclick="clearAllData()" class="text-xs text-rose-400/80 hover:text-rose-400 flex items-center gap-1 cursor-pointer mt-auto self-end">
                    <i class="fa-regular fa-trash-can"></i> Reset Semua Data
                </button>
            </div>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('fintrack_ult_tx')) || [];
        let myChart = null;

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        function initChart(income, expense) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (myChart) myChart.destroy();
            const chartData = (income === 0 && expense === 0) ? [1, 0] : [income, expense];
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: chartData, backgroundColor: ['#10b981', '#f43f5e'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' }
            });
        }

        function updateDOM() {
            let income = 0, expense = 0;
            transactions.forEach(tx => {
                let amt = parseInt(tx.amount);
                if (tx.type === 'income') income += amt;
                else expense += amt;
            });

            document.getElementById('total-balance').innerText = formatRupiah(income - expense);
            document.getElementById('total-income').innerText = `+ ${formatRupiah(income)}`;
            document.getElementById('total-expense').innerText = `- ${formatRupiah(expense)}`;
            initChart(income, expense);
            localStorage.setItem('fintrack_ult_tx', JSON.stringify(transactions));
        }

        function addTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('tx-type').value;
            const wallet = document.getElementById('tx-wallet').value;
            const amount = parseInt(document.getElementById('tx-amount').value);
            const category = document.getElementById('tx-category').value.trim();

            transactions.push({ type, wallet, amount, category });
            updateDOM();
            document.getElementById('tx-form').reset();
            alert("Transaksi berhasil ditambahkan!");
        }

        function clearAllData() {
            if (confirm("Reset ulang seluruh sistem catatan keuangan?")) { transactions = []; updateDOM(); }
        }

        function exportToCSV() {
            if (transactions.length === 0) return alert("Tidak ada data untuk diekspor.");
            let csvContent = "data:text/csv;charset=utf-8,Dompet,Jenis,Kategori,Nominal\n";
            transactions.forEach(tx => { csvContent += `${tx.wallet},${tx.type === 'income'?'Masuk':'Keluar'},"${tx.category}",${tx.amount}\n`; });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `FinTrack_All_Report.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        updateDOM();
    </script>
</body>
</html>
