<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrannTrack Pro — Elite Command Center</title>
    <style>
        /* CSS Dasar tetap sama, penambahan untuk fitur baru */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        :root { --bg: #090d16; --card: rgba(30, 41, 59, 0.7); --text: #f1f5f9; }
        [data-theme="light"] { --bg: #f8fafc; --card: rgba(255, 255, 255, 0.9); --text: #0f172a; }
        body { background: var(--bg); color: var(--text); padding: 40px 20px; min-height: 100vh; display: flex; justify-content: center; transition: 0.3s; }
        .container { width: 100%; max-width: 680px; margin: 0 auto; }
        /* Style lainnya tetap sama... */
        header { text-align: center; margin-bottom: 35px; }
        header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { font-size: 13px; color: #64748b; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; }
        .main-box { background: var(--card); border: 1px solid rgba(128,128,128,0.1); padding: 30px; border-radius: 24px; margin-bottom: 25px; backdrop-filter: blur(12px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .balance-header { display: flex; justify-content: space-between; align-items: center; }
        .balance-title { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .balance-val { font-size: 38px; font-weight: 700; margin: 8px 0 20px 0; color: var(--text); letter-spacing: -1px; }
        .sub-wallet { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; border-top: 1px solid rgba(128,128,128,0.1); padding-top: 20px; margin-bottom: 20px; }
        .w-card { background: rgba(0,0,0,0.2); padding: 14px; border-radius: 14px; text-align: left; font-size: 12px; color: #94a3b8; border: 1px solid rgba(128,128,128,0.1); }
        .w-card strong { display: block; font-size: 16px; margin-top: 6px; color: var(--text); font-weight: 600; }
        .progress-container { background: rgba(0,0,0,0.2); height: 10px; border-radius: 99px; display: flex; overflow: hidden; }
        .progress-bar-segment { height: 100%; transition: width 0.4s ease; }
        .bg-cash { background: #f59e0b; } .bg-bank { background: #3b82f6; } .bg-wallet { background: #10b981; }
        .goal-box { background: rgba(0,0,0,0.1); padding: 20px; border-radius: 20px; margin-bottom: 25px; border: 1px solid rgba(128,128,128,0.1); }
        .goal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .goal-title { font-size: 14px; font-weight: 600; }
        .goal-track { background: rgba(0,0,0,0.2); height: 8px; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
        .goal-bar { background: #6366f1; height: 100%; width: 0%; transition: width 0.4s ease; }
        .form-box { background: var(--card); padding: 25px; border-radius: 24px; margin-bottom: 25px; border: 1px solid rgba(128,128,128,0.1); }
        h3 { font-size: 16px; font-weight: 600; margin-bottom: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 14px; }
        select, input { width: 100%; padding: 14px; background: rgba(0,0,0,0.1); border: 1px solid rgba(128,128,128,0.2); border-radius: 12px; color: var(--text); outline: none; }
        button { width: 100%; padding: 14px; background: #6366f1; color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .table-box { background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid rgba(128,128,128,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px; border-bottom: 1px solid rgba(128,128,128,0.1); }
        .text-green { color: #10b981; } .text-red { color: #f43f5e; }
        .text-minus { color: #f43f5e !important; }
        .w-card-minus { border: 1px solid #f43f5e !important; }
        #pin-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:999; display:flex; align-items:center; justify-content:center; }
    </style>
</head>
<body>

    <div id="pin-overlay">
        <div style="text-align:center;">
            <p>Masukkan PIN Akses</p>
            <input type="password" id="pin-input" maxlength="4" style="width:100px; text-align:center;">
            <button onclick="checkPin()" style="margin-top:10px;">Masuk</button>
        </div>
    </div>

    <div class="container">
        <button onclick="toggleTheme()" style="width:auto; margin-bottom:10px;">🌓 Tema</button>
        <header><h1>BrannTrack Pro</h1></header>

        <div class="main-box">
            <div class="balance-val" id="total-saldo">Rp 0</div>
            <div class="sub-wallet">
                <div class="w-card" id="card-cash">💵 Tunai<strong id="w-cash">Rp 0</strong></div>
                <div class="w-card" id="card-bank">🏛️ Bank<strong id="w-bank">Rp 0</strong></div>
                <div class="w-card" id="card-wallet">📱 E-Wallet<strong id="w-wallet">Rp 0</strong></div>
            </div>
        </div>

        <div class="form-box">
            <h3>Alokasi Transaksi</h3>
            <input type="text" id="input-ket" placeholder="Keterangan (Coba: 'Makan', 'Gaji')" oninput="smartDetect(this.value)">
            <select id="input-tipe"><option value="masuk">Masuk</option><option value="keluar">Keluar</option></select>
            <select id="input-wadah"><option value="cash">Tunai</option><option value="bank">Bank</option><option value="wallet">E-Wallet</option></select>
            <input type="text" id="input-nominal" placeholder="Nominal">
            <button onclick="simpanData()">Konfirmasi</button>
        </div>

        <div class="table-box">
            <h3>Log Riwayat</h3>
            <div id="analytics-box" style="margin-bottom:15px; font-size:12px;"></div>
            <table><tbody id="tabel-body"></tbody></table>
        </div>
    </div>

    <script>
        // Setup Awal
        if(!localStorage.getItem('user_pin')) localStorage.setItem('user_pin', '1234');
        function checkPin() {
            if(document.getElementById('pin-input').value === localStorage.getItem('user_pin')) {
                document.getElementById('pin-overlay').style.display = 'none';
            } else alert('PIN Salah!');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
        }

        function smartDetect(val) {
            const w = document.getElementById('input-wadah');
            if(val.toLowerCase().includes('makan')) w.value = 'cash';
            else if(val.toLowerCase().includes('gaji')) w.value = 'bank';
        }

        // Logic dasar simpanData dan renderUI sama seperti sebelumnya...
        // ... (Tambahkan fungsi renderUI yang menghitung total per bulan untuk Analytics)
    </script>
</body>
</html>
