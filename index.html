<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrannTrack Ultimate</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --primary: #6366f1; --danger: #f43f5e; --success: #10b981; --bg: #050505; --text: #e2e8f0; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 10px; margin: 0; }
        .container { max-width: 500px; margin: auto; }
        .glass { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 15px; margin-bottom: 12px; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 10px; border: 1px solid #333; background: #111; color: white; }
        button { background: var(--primary); font-weight: bold; cursor: pointer; }
        .badge { background: #2d3748; padding: 2px 6px; border-radius: 4px; font-size: 9px; }
    </style>
</head>
<body>

<div class="container">
    <h1>BRANNTRACK ULTIMATE</h1>
    
    <!-- Dashboard Stats -->
    <div class="glass">
        <div class="balance-val" id="total-saldo" style="font-size:32px; font-weight:800; text-align:center;">Rp 0</div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; margin-top:10px;">
            <div class="glass" style="margin:0; text-align:center; font-size:9px;">Tunai<br><b id="w-cash">0</b></div>
            <div class="glass" style="margin:0; text-align:center; font-size:9px;">Bank<br><b id="w-bank">0</b></div>
            <div class="glass" style="margin:0; text-align:center; font-size:9px;">E-Wallet<br><b id="w-wallet">0</b></div>
        </div>
    </div>

    <!-- Chart -->
    <div class="glass">
        <canvas id="myChart"></canvas>
    </div>

    <!-- Input Form -->
    <div class="glass">
        <input type="date" id="in-date">
        <select id="in-tipe"><option value="masuk">🟢 Masuk</option><option value="keluar">🔴 Keluar</option></select>
        <select id="in-wadah"><option value="cash">💵 Tunai</option><option value="bank">🏛️ Bank</option><option value="wallet">📱 E-Wallet</option></select>
        <input type="number" id="in-nom" placeholder="Nominal" required>
        <input type="text" id="in-ket" placeholder="Keterangan" required>
        <button onclick="addTx()">SIMPAN TRANSAKSI</button>
        <button onclick="copyToAca()" style="background:var(--success);">📋 Salin Ringkasan untuk Aca</button>
    </div>

    <!-- History -->
    <div class="glass">
        <input type="text" id="search" placeholder="🔍 Cari..." onkeyup="render()">
        <div id="tbl-body"></div>
    </div>
</div>

<script>
    let txs = JSON.parse(localStorage.getItem('brann_ult')) || [];
    let myChart;

    function vibrate() { if(navigator.vibrate) navigator.vibrate(50); }

    function addTx() {
        vibrate();
        const nom = parseInt(document.getElementById('in-nom').value);
        const date = document.getElementById('in-date').value || new Date().toISOString().split('T')[0];
        txs.push({
            tipe: document.getElementById('in-tipe').value,
            wadah: document.getElementById('in-wadah').value,
            nominal: nom,
            ket: document.getElementById('in-ket').value,
            date: date
        });
        localStorage.setItem('brann_ult', JSON.stringify(txs));
        render();
    }

    function copyToAca() {
        let text = "Ringkasan Keuangan Gibran:\n" + txs.map(t => `${t.date}: ${t.ket} (${t.tipe}) - Rp ${t.nominal}`).join("\n");
        navigator.clipboard.writeText(text);
        alert("Ringkasan berhasil disalin!");
    }

    function render() {
        const body = document.getElementById('tbl-body');
        body.innerHTML = '';
        let total = 0, s = {cash:0, bank:0, wallet:0};
        
        txs.slice().reverse().forEach((t, i) => {
            total += (t.tipe === 'masuk' ? t.nominal : -t.nominal);
            s[t.wadah] += (t.tipe === 'masuk' ? t.nominal : -t.nominal);
            body.innerHTML += `<div style="padding:10px 0; border-bottom:1px solid #333"><b>${t.ket}</b><br><small>${t.date} | ${t.wadah}</small></div>`;
        });

        document.getElementById('total-saldo').innerText = "Rp " + total.toLocaleString();
        document.getElementById('w-cash').innerText = s.cash.toLocaleString();
        document.getElementById('w-bank').innerText = s.bank.toLocaleString();
        document.getElementById('w-wallet').innerText = s.wallet.toLocaleString();
        
        updateChart();
    }

    function updateChart() {
        const ctx = document.getElementById('myChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Tunai', 'Bank', 'E-Wallet'], datasets: [{ data: [1, 2, 3], backgroundColor: ['#f43f5e', '#6366f1', '#10b981'] }] }
        });
    }

    render();
</script>
</body>
</html>
