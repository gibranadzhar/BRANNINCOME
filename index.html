<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack Pro - Simpel & Anti-Crash</title>
    <style>
        /* CSS Dasar Baku & Rapi */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #334155; }
        h1 { color: #818cf8; }
        
        /* Kartu Tampilan Saldo */
        .main-box { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #475569; }
        .balance-title { font-size: 14px; color: #94a3b8; text-transform: uppercase; }
        .balance-val { font-size: 32px; font-weight: bold; margin: 10px 0; color: #ffffff; }
        
        .sub-wallet { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .w-card { background: #0f172a; padding: 10px; border-radius: 8px; text-align: center; font-size: 13px; border: 1px solid #334155; }
        .w-card strong { display: block; font-size: 15px; margin-top: 5px; color: #38bdf8; }
        
        /* Form Input */
        .form-box { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #475569; }
        h3 { margin-bottom: 15px; font-size: 18px; color: #cbd5e1; }
        
        .form-group { display: flex; flex-direction: column; gap: 12px; }
        select, input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 15px; }
        
        button { width: 100%; padding: 12px; background: #6366f1; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { background: #4f46e5; }
        
        .btn-danger { background: #ef4444; margin-top: 10px; padding: 8px; font-size: 13px; }
        .btn-danger:hover { background: #dc2626; }
        
        /* Tabel Riwayat */
        .table-box { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #475569; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; font-size: 14px; }
        th { color: #94a3b8; }
        
        .text-green { color: #10b981; font-weight: bold; }
        .text-red { color: #f43f5e; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>FinTrack PRO</h1>
            <p style="font-size: 12px; color: #94a3b8;">Versi Super Stabil & Ringan</p>
        </header>

        <div class="main-box">
            <span class="balance-title">Total Saldo Bersih</span>
            <div class="balance-val" id="total-saldo">Rp 0</div>
            
            <div class="sub-wallet">
                <div class="w-card">💵 Tunai<strong id="w-cash">Rp 0</strong></div>
                <div class="w-card">🏛️ Bank<strong id="w-bank">Rp 0</strong></div>
                <div class="w-card">📱 E-Wallet<strong id="w-wallet">Rp 0</strong></div>
            </div>
        </div>

        <div class="form-box">
            <h3>Input Transaksi Baru</h3>
            <form id="tx-form" onsubmit="simpanData(event)" class="form-group">
                <select id="input-tipe">
                    <option value="masuk">🟢 Pemasukan (+)</option>
                    <option value="keluar">🔴 Pengeluaran (-)</option>
                </select>
                
                <select id="input-wadah">
                    <option value="cash">💵 Kantong Tunai</option>
                    <option value="bank">🏛️ Rekening Bank</option>
                    <option value="wallet">📱 Saldo E-Wallet</option>
                </select>
                
                <input type="number" id="input-nominal" placeholder="Nominal Angka (Contoh: 50000)" required>
                <input type="text" id="input-ket" placeholder="Keterangan / Kategori (Contoh: Gaji, Makan)" required>
                
                <button type="submit">Simpan Transaksi</button>
            </form>
            <button onclick="hapusSemua()" class="btn-danger">Hapus/Reset Semua Memori</button>
        </div>

        <div class="table-box">
            <h3>Riwayat Transaksi</h3>
            <table>
                <thead>
                    <tr>
                        <th>Dompet</th>
                        <th>Tipe</th>
                        <th>Keterangan</th>
                        <th>Nominal</th>
                    </tr>
                </thead>
                <tbody id="tabel-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Menggunakan Key Storage Baru agar bersih dari sisa data eror sebelumnya
        const STORAGE_KEY = 'fintrack_clean_v1';
        let dataTransaksi = [];

        // Memuat data aman saat pertama kali halaman dibuka
        try {
            dataTransaksi = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            if(!Array.isArray(dataTransaksi)) dataTransaksi = [];
        } catch(e) {
            dataTransaksi = [];
        }

        const formatRupiah = (angka) => "Rp " + Number(angka).toLocaleString('id-ID');

        function simpanData(e) {
            e.preventDefault();
            
            const tipe = document.getElementById('input-tipe').value;
            const wadah = document.getElementById('input-wadah').value;
            const nominal = parseInt(document.getElementById('input-nominal').value) || 0;
            const ket = document.getElementById('input-ket').value;

            if (nominal <= 0) {
                alert("Masukkan nominal angka yang benar!");
                return;
            }

            // Tambahkan data baru ke array
            dataTransaksi.push({ tipe, wadah, nominal, ket });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dataTransaksi));
            
            // Reset form input
            document.getElementById('tx-form').reset();
            
            // Perbarui tampilan
            renderUI();
        }

        function hapusSemua() {
            if(confirm("Apakah Anda yakin ingin menghapus seluruh riwayat saldo?")) {
                dataTransaksi = [];
                localStorage.setItem(STORAGE_KEY, '[]');
                renderUI();
            }
        }

        function renderUI() {
            let totalSemua = 0;
            let saldoPerWadah = { cash: 0, bank: 0, wallet: 0 };
            
            const tbody = document.getElementById('tabel-body');
            if(tbody) tbody.innerHTML = '';

            // Hitung akumulasi kalkulasi saldo murni
            dataTransaksi.forEach(tx => {
                let nom = Number(tx.nominal) || 0;
                if (tx.tipe === 'masuk') {
                    totalSemua += nom;
                    saldoPerWadah[tx.wadah] += nom;
                } else {
                    totalSemua -= nom;
                    saldoPerWadah[tx.wadah] -= nom;
                }

                // Masukkan baris data ke dalam tabel riwayat
                if(tbody) {
                    const labelTipe = tx.tipe === 'masuk' ? '<span class="text-green">Masuk</span>' : '<span class="text-red">Keluar</span>';
                    const kelasNominal = tx.tipe === 'masuk' ? 'text-green' : 'text-red';
                    const tanda = tx.tipe === 'masuk' ? '+ ' : '- ';
                    const labelWadah = tx.wadah === 'bank' ? '🏛️ Bank' : tx.wadah === 'wallet' ? '📱 E-Wallet' : '💵 Tunai';

                    tbody.innerHTML += `
                        <tr>
                            <td>${labelWadah}</td>
                            <td>${labelTipe}</td>
                            <td>${tx.ket}</td>
                            <td class="${kelasNominal}">${tanda}${formatRupiah(nom)}</td>
                        </tr>
                    `;
                }
            });

            // Pasang hasil kalkulasi ke elemen teks HTML secara presisi
            if(document.getElementById('total-saldo')) document.getElementById('total-saldo').innerText = formatRupiah(totalSemua);
            if(document.getElementById('w-cash')) document.getElementById('w-cash').innerText = formatRupiah(saldoPerWadah.cash);
            if(document.getElementById('w-bank')) document.getElementById('w-bank').innerText = formatRupiah(saldoPerWadah.bank);
            if(document.getElementById('w-wallet')) document.getElementById('w-wallet').innerText = formatRupiah(saldoPerWadah.wallet);
        }

        // Jalankan UI segera setelah halaman selesai memuat komponen HTML
        window.addEventListener('DOMContentLoaded', () => {
            renderUI();
        });
    </script>
</body>
</html>
