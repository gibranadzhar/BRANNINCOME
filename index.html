<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRANNTRACK | PREMIUM EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');
        :root { --bg: #050505; --accent: #7c3aed; --glass: rgba(255, 255, 255, 0.06); }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 420px; }
        
        /* Premium Glassmorphism */
        .glass-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 25px; margin-bottom: 20px; }
        
        h1 { font-size: 18px; text-align: center; letter-spacing: 5px; color: #a78bfa; margin-bottom: 25px; }
        .balance { font-size: 40px; font-weight: 700; text-align: center; margin: 10px 0; background: linear-gradient(to right, #fff, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-item { text-align: center; font-size: 9px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 15px; }
        
        input, select, button { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 18px; border: none; background: rgba(255,255,255,0.05); color: white; font-size: 14px; }
        button { background: var(--accent); font-weight: 600; cursor: pointer; transition: 0.3s; }
        button:hover { background: #6d28d9; }
        
        .history-list { max-height: 250px; overflow-y: auto; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="app-container">
    <h1>BRANNTRACK</h1>
    
    <div class="glass-card">
        <div style="text-align: center; font-size: 10px; opacity: 0.5;">CURRENT BALANCE</div>
        <div class="balance" id="total-saldo">Rp 0</div>
        <div class="stat-grid">
            <div class="stat-item">Cash<br><b id="w-cash">0</b></div>
            <div class="stat-item">Bank<br><b id="w-bank">0</b></div>
            <div class="stat-item">Wallet<br><b id="w-wallet">0</b></div>
        </div>
    </div>

    <div class="glass-card"><canvas id="myChart"></canvas></div>

    <div class="glass-card">
        <input type="date" id="in-date">
        <input type="text" id="search" placeholder="Cari transaksi..." onkeyup="render()">
        <select id="in-tipe"><option value="masuk">Pemasukan (+)</option><option value="keluar">Pengeluaran (-)</option></select>
        <select id="in-wadah"><option value="cash">Tunai</option><option value="bank">Bank</option><option value="wallet">E-Wallet</option></select>
        <input type="number" id="in-nom" placeholder="Nominal (Rp)">
        <input type="text" id="in-ket" placeholder="Keterangan">
        <button onclick="addTx()">TAMBAH DATA</button>
        <button style="background:transparent; border:1px solid #4c1d95;" onclick="copyToAca()">COPY RINGKASAN UNTUK ACA</button>
    </div>

    <div class="glass-card history-list" id="tbl-body"></div>
</div>

<script>
    let txs = JSON.parse(localStorage.getItem('brann_v4')) || [];
    let myChart;

    function addTx() {
        const nom = parseInt(document.getElementById('in-nom').value);
        const tipe = document.getElementById('in-tipe').value;
        const wadah = document.getElementById('in-wadah').value;
        
        // Anti-Minus
        let s = {cash:0, bank:0, wallet:0};
        txs.forEach(t => s[t.wadah] += (t.tipe === 'masuk' ? t.nominal : -t.nominal));
        if(tipe === 'keluar' && nom > s[wadah]) return alert("Saldo tidak cukup!");

        txs.push({tipe, wadah, nominal: nom, ket: document.getElementById('in-ket').value, date: document.getElementById('in-date').value || new Date().toISOString().split('T')[0]});
        localStorage.setItem('brann_v4', JSON.stringify(txs));
        render();
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const body = document.getElementById('tbl-body');
        body.innerHTML = '';
        let total = 0, s = {cash:0, bank:0, wallet:0};
        
        txs.slice().reverse().forEach(t => {
            if(t.ket.toLowerCase().includes(query)) {
                total += (t.tipe === 'masuk' ? t.nominal : -t.nominal);
                s[t.wadah] += (t.tipe === 'masuk' ? t.nominal : -t.nominal);
                body.innerHTML += `<div class="list-item">
                    <div><b style="font-size:14px;">${t.ket}</b><br><small style="opacity:0.5;">${t.date}</small></div>
                    <div style="color:${t.tipe==='masuk'?'#10b981':'#f43f5e'}">${t.tipe==='masuk'?'+':'-'}${t.nominal.toLocaleString()}</div>
                </div>`;
            }
        });
        document.getElementById('total-saldo').innerText = "Rp " + total.toLocaleString();
        document.getElementById('w-cash').innerText = s.cash.toLocaleString();
        document.getElementById('w-bank').innerText = s.bank.toLocaleString();
        document.getElementById('w-wallet').innerText = s.wallet.toLocaleString();
        
        const ctx = document.getElementById('myChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Tunai', 'Bank', 'Wallet'], datasets: [{ data: [s.cash, s.bank, s.wallet], backgroundColor: ['#8b5cf6', '#6366f1', '#ec4899'] }] } });
    }

    function copyToAca() {
        let text = "Ringkasan Keuangan Gibran:\n" + txs.map(t => `${t.date}: ${t.ket} - Rp ${t.nominal}`).join("\n");
        navigator.clipboard.writeText(text); alert("Data disalin!");
    }
    render();
</script>
</body>
</html>
