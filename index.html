<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrannTrack Ultimate Legendary</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --neon-blue: #00f3ff; --neon-purple: #9d00ff; 
            --glass: rgba(255, 255, 255, 0.03); 
            --bg: #0a0a0c; 
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: #fff; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; }
        
        /* Glassmorphism Card */
        .card { 
            background: var(--glass); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 24px; 
            padding: 24px; 
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); letter-spacing: 3px; }
        
        input, select, button { 
            width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; outline: none;
        }
        button { background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple)); border: none; font-weight: bold; cursor: pointer; color: white; }
        button:active { transform: scale(0.95); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .stat-item { text-align: center; font-size: 10px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>BRANNTRACK</h1>
    
    <div class="card">
        <div style="font-size:10px; text-align:center; opacity:0.6;">TOTAL SALDO</div>
        <div id="total-saldo" style="font-size:36px; font-weight:800; text-align:center; margin:10px 0;">Rp 0</div>
        <div class="stat-grid">
            <div class="stat-item">Tunai<br><b id="w-cash">0</b></div>
            <div class="stat-item">Bank<br><b id="w-bank">0</b></div>
            <div class="stat-item">E-Wallet<br><b id="w-wallet">0</b></div>
        </div>
    </div>

    <div class="card">
        <canvas id="myChart"></canvas>
    </div>

    <div class="card">
        <input type="date" id="in-date">
        <select id="in-tipe"><option value="masuk">🟢 Masuk</option><option value="keluar">🔴 Keluar</option></select>
        <select id="in-wadah"><option value="cash">💵 Tunai</option><option value="bank">🏛️ Bank</option><option value="wallet">📱 E-Wallet</option></select>
        <input type="number" id="in-nom" placeholder="Nominal (Rp)">
        <input type="text" id="in-ket" placeholder="Keterangan">
        <button onclick="addTx()">TAMBAH TRANSAKSI</button>
        <button onclick="copyToAca()" style="background:transparent; border:1px solid var(--neon-blue);">📋 COPY RINGKASAN KE ACA</button>
    </div>

    <div class="card" id="history-box">
        <h2 style="font-size:14px; margin-bottom:15px;">Riwayat Terbaru</h2>
        <div id="tbl-body"></div>
    </div>
</div>

<script>
    let txs = JSON.parse(localStorage.getItem('brann_final')) || [];
    let myChart;

    function addTx() {
        const nom = parseInt(document.getElementById('in-nom').value);
        const tipe = document.getElementById('in-tipe').value;
        const wadah = document.getElementById('in-wadah').value;
        
        // Anti-Minus
        let s = {cash:0, bank:0, wallet:0};
        txs.forEach(t => s[t.wadah] += (t.tipe === 'masuk' ? t.nominal : -t.nominal));
        if(tipe === 'keluar' && nom > s[wadah]) return alert("Saldo tidak cukup!");

        txs.push({tipe, wadah, nominal: nom, ket: document.getElementById('in-ket').value, date: document.getElementById('in-date').value || new Date().toISOString().split('T')[0]});
        localStorage.setItem('brann_final', JSON.stringify(txs));
        render();
    }

    function render() {
        const body = document.getElementById('tbl-body');
        body.innerHTML = '';
        let total = 0, s = {cash:0, bank:0, wallet:0};
        
        txs.slice().reverse().forEach(t => {
            total += (t.tipe === 'masuk' ? t.nominal : -t.nominal);
            s[t.wadah] += (t.tipe === 'masuk' ? t.nominal : -t.nominal);
            body.innerHTML += `<div style="padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:12px;">
                <b>${t.ket}</b><br><small>${t.date} • ${t.wadah} • ${t.tipe === 'masuk' ? '+'+t.nominal : '-'+t.nominal}</small>
            </div>`;
        });

        document.getElementById('total-saldo').innerText = "Rp " + total.toLocaleString();
        document.getElementById('w-cash').innerText = s.cash.toLocaleString();
        document.getElementById('w-bank').innerText = s.bank.toLocaleString();
        document.getElementById('w-wallet').innerText = s.wallet.toLocaleString();
        updateChart([s.cash, s.bank, s.wallet]);
    }

    function updateChart(data) {
        const ctx = document.getElementById('myChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Tunai', 'Bank', 'E-Wallet'], datasets: [{ data: data, backgroundColor: ['#00f3ff', '#9d00ff', '#ff007a'] }] },
            options: { plugins: { legend: { labels: { color: 'white' } } } }
        });
    }

    function copyToAca() {
        let text = "Ringkasan Keuangan:\n" + txs.map(t => `${t.date}: ${t.ket} (${t.tipe}) - Rp ${t.nominal}`).join("\n");
        navigator.clipboard.writeText(text);
        alert("Data tersalin untuk Aca!");
    }

    render();
</script>
</body>
</html>
