<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrannTrack Pro — Ultimate Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #090d16; color: #f1f5f9; padding: 40px 20px; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 680px; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(99, 102, 241, 0.2); padding: 25px; border-radius: 24px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .balance-val { font-size: 36px; font-weight: 700; color: #fff; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .summary-box { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; text-align: center; }
        
        .goal-bar-bg { background: #0f172a; height: 12px; border-radius: 99px; overflow: hidden; border: 1px solid rgba(99,102,241,0.2); }
        .goal-bar-fill { background: linear-gradient(90deg, #6366f1, #a5b4fc); height: 100%; width: 0%; transition: width 0.5s ease; box-shadow: 0 0 15px #6366f1; }
        
        input, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; margin-bottom: 10px; }
        button { padding: 12px; background: #6366f1; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { color: #64748b; font-size: 11px; padding: 10px; text-align: left; text-transform: uppercase; }
        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .text-green { color: #10b981; } .text-red { color: #f43f5e; }
        .badge { padding: 2px 8px; background: #334155; border-radius: 6px; font-size: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>BrannTrack Pro</h1></header>

    <div class="card">
        <div style="color: #94a3b8; font-size: 12px;">TOTAL SALDO</div>
        <div class="balance-val" id="total-saldo">Rp 0</div>
        <div class="summary-grid">
            <div class="summary-box">
                <div style="font-size: 10px; color: #94a3b8;">PEMASUKAN</div>
                <div id="sum-in" class="text-green" style="font-weight: 600;">Rp 0</div>
            </div>
            <div class="summary-box">
                <div style="font-size: 10px; color: #94a3b8;">PENGELUARAN</div>
                <div id="sum-out" class="text-red" style="font-weight: 600;">Rp 0</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span id="lbl-goal-name" style="font-weight:600; font-size: 14px;">🎯 Target: Belum Ditentukan</span>
            <span id="lbl-goal-pct" style="color:#6366f1; font-weight:700;">0%</span>
        </div>
        <div class="goal-bar-bg"><div id="bar-goal" class="goal-bar-fill"></div></div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <input type="text" id="input-goal-name" placeholder="Nama Target">
            <input type="number" id="input-goal-target" placeholder="Nominal">
            <button onclick="setNewGoal()" style="width: 80px;">Set</button>
        </div>
    </div>

    <div class="card">
        <form id="tx-form" onsubmit="simpanData(event)">
            <select id="input-tipe"><option value="masuk">🟢 Masuk (+)</option><option value="keluar">🔴 Keluar (-)</option></select>
            <select id="input-wadah"><option value="cash">💵 Tunai</option><option value="bank">🏛️ Bank</option><option value="wallet">📱 E-Wallet</option></select>
            <input type="number" id="input-nominal" placeholder="Nominal (Rp)" required>
            <input type="text" id="input-ket" placeholder="Keterangan" required>
            <button type="submit">Simpan Transaksi</button>
        </form>
    </div>

    <div class="card">
        <table>
            <thead><tr><th>Waktu</th><th>Info</th><th>Nominal</th><th>Aksi</th></tr></thead>
            <tbody id="tabel-body"></tbody>
        </table>
    </div>
</div>

<script>
    let dataTransaksi = JSON.parse(localStorage.getItem('fintrack_pro_data')) || [];
    let dataGoal = JSON.parse(localStorage.getItem('fintrack_goal_pro')) || { name: "Target", target: 0 };

    function simpanData(e) {
        e.preventDefault();
        const nominal = parseInt(document.getElementById('input-nominal').value);
        const tipe = document.getElementById('input-tipe').value;
        const wadah = document.getElementById('input-wadah').value;
        
        // Cek Saldo untuk Validasi Anti-Minus
        let currentTotal = 0;
        dataTransaksi.forEach(t => currentTotal += (t.tipe === 'masuk' ? t.nominal : -t.nominal));
        
        if (tipe === 'keluar' && nominal > currentTotal) {
            return alert("⚠️ Saldo tidak cukup! Total saldo saat ini: Rp " + currentTotal.toLocaleString());
        }

        dataTransaksi.push({ 
            tipe, wadah, nominal, 
            ket: document.getElementById('input-ket').value, 
            date: new Date().toLocaleDateString('id-ID') 
        });
        localStorage.setItem('fintrack_pro_data', JSON.stringify(dataTransaksi));
        renderUI();
    }

    function renderUI() {
        let total = 0, sumIn = 0, sumOut = 0;
        const tbody = document.getElementById('tabel-body');
        tbody.innerHTML = '';
        
        dataTransaksi.slice().reverse().forEach((tx, i) => {
            total += (tx.tipe === 'masuk' ? tx.nominal : -tx.nominal);
            if(tx.tipe === 'masuk') sumIn += tx.nominal; else sumOut += tx.nominal;
            
            tbody.innerHTML += `<tr>
                <td style="color:#64748b; font-size:10px;">${tx.date}</td>
                <td>${tx.ket}</td>
                <td class="${tx.tipe === 'masuk' ? 'text-green' : 'text-red'}">${tx.tipe === 'masuk'?'+':'-'}${tx.nominal.toLocaleString()}</td>
                <td><button onclick="hapusSatu(${dataTransaksi.length - 1 - i})" style="background:transparent; border:none; color:#64748b; cursor:pointer;">🗑️</button></td>
            </tr>`;
        });

        document.getElementById('total-saldo').innerText = "Rp " + total.toLocaleString();
        document.getElementById('sum-in').innerText = "Rp " + sumIn.toLocaleString();
        document.getElementById('sum-out').innerText = "Rp " + sumOut.toLocaleString();
        
        let pct = dataGoal.target > 0 ? Math.min(100, (total / dataGoal.target) * 100) : 0;
        document.getElementById('bar-goal').style.width = pct + "%";
        document.getElementById('lbl-goal-pct').innerText = Math.floor(pct) + "%";
        document.getElementById('lbl-goal-name').innerText = "🎯 Target: " + dataGoal.name;
    }

    function setNewGoal() {
        dataGoal = { 
            name: document.getElementById('input-goal-name').value, 
            target: parseInt(document.getElementById('input-goal-target').value) 
        };
        localStorage.setItem('fintrack_goal_pro', JSON.stringify(dataGoal));
        renderUI();
    }

    function hapusSatu(i) { dataTransaksi.splice(i, 1); localStorage.setItem('fintrack_pro_data', JSON.stringify(dataTransaksi)); renderUI(); }
    renderUI();
</script>
</body>
</html>
