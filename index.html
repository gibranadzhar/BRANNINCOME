<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack Pro - Ultimate</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: sans-serif; transition: all 0.3s ease; }
        .theme-cyber { background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617); color: #f1f5f9; }
        .theme-mint { background: radial-gradient(circle at top right, #064e3b, #022c22, #010605); color: #f1f5f9; }
        .theme-light { background: #f8fafc; color: #0f172a; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .theme-light .glass { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(0, 0, 0, 0.1); }
        .budget-alert { animation: blink 1s infinite; border: 2px solid #ef4444; }
        @keyframes blink { 50% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); } }
    </style>
</head>
<body class="theme-cyber min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 glass p-4 rounded-2xl">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">FinTrack PRO</h1>
            <div class="flex gap-2">
                <button onclick="setTheme('theme-cyber')" class="px-3 py-1 bg-indigo-900 rounded-lg text-xs font-bold text-white cursor-pointer hover:bg-indigo-800">Cyber</button>
                <button onclick="setTheme('theme-mint')" class="px-3 py-1 bg-emerald-900 rounded-lg text-xs font-bold text-white cursor-pointer hover:bg-emerald-800">Mint</button>
                <button onclick="setTheme('theme-light')" class="px-3 py-1 bg-slate-200 rounded-lg text-xs font-bold text-slate-800 cursor-pointer hover:bg-slate-300">Light</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="glass p-5 rounded-2xl">
                <p class="text-xs opacity-70 uppercase tracking-wider">Total Saldo</p>
                <h3 id="val-balance" class="text-2xl font-bold mt-1">Rp 0</h3>
            </div>
            <div class="glass p-5 rounded-2xl">
                <p class="text-xs text-emerald-400 uppercase tracking-wider">Pemasukan</p>
                <h3 id="val-income" class="text-2xl font-bold mt-1 text-emerald-400">Rp 0</h3>
            </div>
            <div id="card-expense" class="glass p-5 rounded-2xl">
                <p class="text-xs text-rose-400 uppercase tracking-wider">Pengeluaran</p>
                <h3 id="val-expense" class="text-2xl font-bold mt-1 text-rose-400">Rp 0</h3>
            </div>
            <div class="glass p-5 rounded-2xl flex flex-col justify-center">
                <p class="text-xs text-amber-400 uppercase tracking-wider mb-2">Limit Bulanan</p>
                <input type="number" id="input-budget" oninput="saveBudget()" placeholder="Set Limit..." class="w-full bg-transparent border-b border-slate-500 outline-none text-lg">
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="space-y-6">
                <div class="glass p-4 rounded-2xl">
                    <h2 class="text-sm font-bold mb-2 opacity-80">🧮 Kalkulator Mini</h2>
                    <input type="text" id="calc-display" disabled class="w-full bg-slate-900/50 text-right p-2 rounded-lg mb-2 border border-slate-700 text-white">
                    <div class="grid grid-cols-4 gap-1 text-sm">
                        <button onclick="calc('7')" class="p-2 bg-slate-800 rounded hover:bg-slate-700 text-white">7</button>
                        <button onclick="calc('8')" class="p-2 bg-slate-800 rounded hover:bg-slate-700 text-white">8</button>
                        <button onclick="calc('9')" class="p-2 bg-slate-800 rounded hover:bg-slate-700 text-white">9</button>
                        <button onclick="calc('/')" class="p-2 bg-indigo-900 rounded hover:bg-indigo-800 text-white">/</button>
                        <button onclick="calc('4')" class="p-2 bg-slate-800 rounded hover:bg-slate-700 text-white">4</button>
                        <button onclick="calc('5')" class="p-2 bg-slate-800 rounded hover:bg-slate-700 text-white">5</button>
                        <button onclick="calc('6')" class="p-2 bg-slate-800 rounded hover:bg-slate-700 text-white">6</button>
                        <button onclick="calc('*')" class="p-2 bg-indigo-900 rounded hover:bg-indigo-800 text-white">x</button>
                        <button onclick="calc('1')" class="p-2 bg-slate-800 rounded hover:bg-slate-700 text-white">1</button>
                        <button onclick="calc('2')" class="p-2 bg-slate-800 rounded hover:bg-slate-700 text-white">2</button>
                        <button onclick="calc('3')" class="p-2 bg-slate-800 rounded hover:bg-slate-700 text-white">3</button>
                        <button onclick="calc('-')" class="p-2 bg-indigo-900 rounded hover:bg-indigo-800 text-white">-</button>
                        <button onclick="calc('C')" class="p-2 bg-rose-900 rounded hover:bg-rose-800 text-white">C</button>
                        <button onclick="calc('0')" class="p-2 bg-slate-800 rounded hover:bg-slate-700 text-white">0</button>
                        <button onclick="calc('=')" class="p-2 bg-emerald-700 rounded hover:bg-emerald-600 font-bold text-white">=</button>
                        <button onclick="calc('+')" class="p-2 bg-indigo-900 rounded hover:bg-indigo-800 text-white">+</button>
                    </div>
                </div>

                <form id="form-tx" onsubmit="addTx(event)" class="glass p-5 rounded-2xl space-y-3">
                    <select id="tx-type" class="w-full bg-slate-900/50 border border-slate-700 rounded p-2 text-sm text-white outline-none">
                        <option value="income">🟢 Pemasukan (+)</option>
                        <option value="expense">🔴 Pengeluaran (-)</option>
                    </select>
                    <input type="number" id="tx-amount" required placeholder="Nominal (Rp)" class="w-full bg-slate-900/50 border border-slate-700 rounded p-2 text-sm text-white outline-none">
                    <input type="text" id="tx-cat" required placeholder="Kategori (cth: Makan, Gaji)" class="w-full bg-slate-900/50 border border-slate-700 rounded p-2 text-sm text-white outline-none">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded text-sm font-bold cursor-pointer">Simpan</button>
                </form>
            </div>

            <div class="lg:col-span-2 glass p-5 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold opacity-80">Riwayat Transaksi</h2>
                    <button onclick="clearData()" class="text-xs bg-rose-900/50 text-rose-400 px-3 py-1 rounded hover:bg-rose-900 cursor-pointer">Reset Semua</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="border-b border-slate-700/50 opacity-70">
                                <th class="p-2">Tipe</th>
                                <th class="p-2">Kategori</th>
                                <th class="p-2">Nominal</th>
                                <th class="p-2 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="history-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // INISIALISASI DATA
        let txs = JSON.parse(localStorage.getItem('fintrack_data')) || [];
        
        const fmtRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

        // FUNGSI TEMA
        function setTheme(theme) {
            document.body.className = `${theme} min-h-screen p-4 md:p-8`;
            localStorage.setItem('fintrack_theme', theme);
        }

        // FUNGSI LIMIT BUDGET
        function saveBudget() {
            localStorage.setItem('fintrack_budget', document.getElementById('input-budget').value);
            updateUI();
        }

        // FUNGSI KALKULATOR
        function calc(val) {
            const disp = document.getElementById('calc-display');
            if (val === 'C') disp.value = '';
            else if (val === '=') {
                try { disp.value = eval(disp.value) || ''; } 
                catch (e) { disp.value = 'Error'; setTimeout(()=>disp.value='', 1000); }
            } else { disp.value += val; }
        }

        // FUNGSI TAMBAH DATA
        function addTx(e) {
            e.preventDefault();
            const type = document.getElementById('tx-type').value;
            const amount = parseInt(document.getElementById('tx-amount').value);
            const cat = document.getElementById('tx-cat').value;

            if (amount > 0) {
                txs.push({ id: Date.now(), type, amount, cat });
                localStorage.setItem('fintrack_data', JSON.stringify(txs));
                document.getElementById('form-tx').reset();
                if ("vibrate" in navigator) navigator.vibrate(100);
                updateUI();
            }
        }

        // FUNGSI HAPUS SATUAN
        function deleteTx(id) {
            txs = txs.filter(tx => tx.id !== id);
            localStorage.setItem('fintrack_data', JSON.stringify(txs));
            updateUI();
        }

        function clearData() {
            if (confirm("Yakin hapus semua data?")) { txs = []; localStorage.setItem('fintrack_data', '[]'); updateUI(); }
        }

        // FUNGSI UPDATE TAMPILAN
        function updateUI() {
            let inc = 0, exp = 0;
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = '';

            txs.forEach(tx => {
                if (tx.type === 'income') inc += tx.amount; else exp += tx.amount;
                
                // Render Tabel
                tbody.innerHTML += `
                    <tr class="border-b border-slate-700/30">
                        <td class="p-2">${tx.type === 'income' ? '🟢' : '🔴'}</td>
                        <td class="p-2">${tx.cat}</td>
                        <td class="p-2 font-mono ${tx.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">${fmtRp(tx.amount)}</td>
                        <td class="p-2 text-center">
                            <button onclick="deleteTx(${tx.id})" class="text-rose-500 hover:text-rose-300 cursor-pointer">✕</button>
                        </td>
                    </tr>
                `;
            });

            // Update Angka
            document.getElementById('val-balance').innerText = fmtRp(inc - exp);
            document.getElementById('val-income').innerText = `+ ${fmtRp(inc)}`;
            document.getElementById('val-expense').innerText = `- ${fmtRp(exp)}`;

            // Logika Alarm Limit Budget
            const limit = parseInt(localStorage.getItem('fintrack_budget')) || 0;
            const expCard = document.getElementById('card-expense');
            if (limit > 0 && exp > limit) expCard.classList.add('budget-alert');
            else expCard.classList.remove('budget-alert');
        }

        // LOAD SAAT REFRESH
        document.body.className = localStorage.getItem('fintrack_theme') || 'theme-cyber min-h-screen p-4 md:p-8';
        document.getElementById('input-budget').value = localStorage.getItem('fintrack_budget') || '';
        updateUI();
    </script>
</body>
</html>
