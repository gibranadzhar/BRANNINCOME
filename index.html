<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack Pro - Ultimate</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.3s ease; }
        /* Tema */
        body.theme-cyber { background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617); color: #f1f5f9; }
        body.theme-light { background: radial-gradient(circle at top right, #f8fafc, #f1f5f9, #e2e8f0); color: #0f172a; }
        
        /* Glassmorphism */
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        body.theme-light .glass-card { background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(0, 0, 0, 0.1); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        /* Light Mode Text Fixes */
        body.theme-light .text-white { color: #0f172a; }
        body.theme-light .text-slate-400 { color: #475569; }
        body.theme-light input, body.theme-light select { background-color: #ffffff; color: #0f172a; border-color: #cbd5e1; }
        
        /* Alarm Budget */
        .budget-alert { animation: blink 1.5s infinite; border: 1.5px solid #f43f5e !important; }
        @keyframes blink { 50% { box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); } }
    </style>
</head>
<body class="theme-cyber min-h-screen antialiased">
    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-800/60 pb-6">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-vault text-white"></i>
                </div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">FinTrack<span class="text-xs font-semibold ml-1 px-2 py-0.5 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 rounded-full">PRO</span></h1>
            </div>
            
            <div class="flex items-center gap-2 bg-slate-900/50 p-1.5 rounded-xl border border-slate-700/50">
                <button onclick="setTheme('theme-cyber')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-indigo-400 hover:bg-slate-800 cursor-pointer"><i class="fa-solid fa-moon"></i> Cyber</button>
                <button onclick="setTheme('theme-light')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-amber-500 hover:bg-slate-800 cursor-pointer"><i class="fa-solid fa-sun"></i> Light</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="glass-card rounded-2xl p-5">
                <p class="text-slate-400 text-xs font-semibold uppercase flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-indigo-400"></span>Saldo</p>
                <h3 id="val-balance" class="text-2xl font-bold mt-2 text-white">Rp 0</h3>
            </div>
            <div class="glass-card rounded-2xl p-5 border-emerald-500/10">
                <p class="text-emerald-400 text-xs font-semibold uppercase flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-emerald-400"></span>Pemasukan</p>
                <h3 id="val-income" class="text-2xl font-bold mt-2 text-emerald-400">+ Rp 0</h3>
            </div>
            <div id="card-expense" class="glass-card rounded-2xl p-5 border-rose-500/10">
                <p class="text-rose-400 text-xs font-semibold uppercase flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-rose-400"></span>Pengeluaran</p>
                <h3 id="val-expense" class="text-2xl font-bold mt-2 text-rose-400">- Rp 0</h3>
            </div>
            <div class="glass-card rounded-2xl p-5">
                <p class="text-amber-400 text-xs font-semibold uppercase flex items-center gap-2 mb-2"><i class="fa-solid fa-bell"></i> Limit Bulanan</p>
                <input type="number" id="input-budget" oninput="saveBudget()" placeholder="Set limit..." class="w-full bg-transparent border-b border-slate-600 outline-none text-xl font-bold text-white placeholder-slate-600">
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <div class="space-y-6 lg:col-span-1">
                <div class="glass-card rounded-2xl p-5">
                    <h2 class="font-bold mb-4 text-white text-sm"><i class="fa-solid fa-plus-circle text-indigo-400"></i> Catat Transaksi</h2>
                    <form id="form-tx" onsubmit="addTx(event)" class="space-y-3">
                        <select id="tx-type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none">
                            <option value="income">🟢 Pemasukan (+)</option>
                            <option value="expense">🔴 Pengeluaran (-)</option>
                        </select>
                        <input type="number" id="tx-amount" required placeholder="Nominal (Rp)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none">
                        <input type="text" id="tx-cat" required placeholder="Kategori (Makan, Gaji)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none">
                        <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-bold py-2.5 rounded-xl text-xs cursor-pointer shadow-lg shadow-indigo-500/20">Simpan</button>
                    </form>
                </div>

                <div class="glass-card rounded-2xl p-4">
                    <h2 class="font-bold mb-3 text-white text-sm"><i class="fa-solid fa-calculator text-indigo-400"></i> Kalkulator</h2>
                    <input type="text" id="calc-display" disabled class="w-full bg-slate-900 text-right p-2 rounded-xl mb-3 border border-slate-700 text-white font-mono text-sm tracking-wider">
                    <div class="grid grid-cols-4 gap-1.5">
                        <button onclick="calc('7')" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-white text-xs font-bold cursor-pointer">7</button>
                        <button onclick="calc('8')" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-white text-xs font-bold cursor-pointer">8</button>
                        <button onclick="calc('9')" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-white text-xs font-bold cursor-pointer">9</button>
                        <button onclick="calc('/')" class="p-2 bg-indigo-900/80 rounded-lg hover:bg-indigo-700 text-indigo-300 text-xs font-bold cursor-pointer">/</button>
                        <button onclick="calc('4')" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-white text-xs font-bold cursor-pointer">4</button>
                        <button onclick="calc('5')" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-white text-xs font-bold cursor-pointer">5</button>
                        <button onclick="calc('6')" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-white text-xs font-bold cursor-pointer">6</button>
                        <button onclick="calc('*')" class="p-2 bg-indigo-900/80 rounded-lg hover:bg-indigo-700 text-indigo-300 text-xs font-bold cursor-pointer">x</button>
                        <button onclick="calc('1')" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-white text-xs font-bold cursor-pointer">1</button>
                        <button onclick="calc('2')" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-white text-xs font-bold cursor-pointer">2</button>
                        <button onclick="calc('3')" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-white text-xs font-bold cursor-pointer">3</button>
                        <button onclick="calc('-')" class="p-2 bg-indigo-900/80 rounded-lg hover:bg-indigo-700 text-indigo-300 text-xs font-bold cursor-pointer">-</button>
                        <button onclick="calc('C')" class="p-2 bg-rose-900/80 rounded-lg hover:bg-rose-700 text-rose-300 text-xs font-bold cursor-pointer">C</button>
                        <button onclick="calc('0')" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-white text-xs font-bold cursor-pointer">0</button>
                        <button onclick="calc('=')" class="p-2 bg-emerald-600 rounded-lg hover:bg-emerald-500 text-white text-xs font-bold cursor-pointer">=</button>
                        <button onclick="calc('+')" class="p-2 bg-indigo-900/80 rounded-lg hover:bg-indigo-700 text-indigo-300 text-xs font-bold cursor-pointer">+</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                
                <div class="glass-card rounded-2xl p-6 flex flex-col sm:flex-row items-center gap-8 justify-center">
                    <div class="w-40 h-40"><canvas id="financeChart"></canvas></div>
                    <div class="text-center sm:text-left">
                        <h2 class="text-lg font-bold text-white mb-2">Analisis Keuangan</h2>
                        <p class="text-xs text-slate-400 max-w-xs">Grafik visual dari perbandingan total pemasukan dan pengeluaran kamu bulan ini.</p>
                    </div>
                </div>

                <div class="glass-card rounded-2xl p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-white text-sm"><i class="fa-solid fa-list-ul text-indigo-400"></i> Riwayat Terakhir</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead>
                                <tr class="border-b border-slate-700/50 text-slate-400">
                                    <th class="p-3 font-semibold">Tipe</th>
                                    <th class="p-3 font-semibold">Kategori</th>
                                    <th class="p-3 font-semibold">Nominal</th>
                                    <th class="p-3 font-semibold text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="history-body">
                                </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        let txs = JSON.parse(localStorage.getItem('fintrack_data')) || [];
        let myChart = null;

        const fmtRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

        function setTheme(theme) {
            document.body.className = `${theme} min-h-screen antialiased`;
            localStorage.setItem('fintrack_theme', theme);
        }

        function saveBudget() {
            localStorage.setItem('fintrack_budget', document.getElementById('input-budget').value);
            updateUI();
        }

        function calc(val) {
            const disp = document.getElementById('calc-display');
            if (val === 'C') disp.value = '';
            else if (val === '=') {
                try { disp.value = eval(disp.value) || ''; } 
                catch (e) { disp.value = 'Error'; setTimeout(()=>disp.value='', 1000); }
            } else { disp.value += val; }
        }

        function initChart(inc, exp) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (myChart) myChart.destroy();
            const data = (inc === 0 && exp === 0) ? [1, 0] : [inc, exp];
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: data, backgroundColor: ['#10b981', '#f43f5e'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%' }
            });
        }

        function addTx(e) {
            e.preventDefault();
            const type = document.getElementById('tx-type').value;
            const amount = parseInt(document.getElementById('tx-amount').value);
            const cat = document.getElementById('tx-cat').value;

            if (amount > 0) {
                txs.push({ id: Date.now(), type, amount, cat });
                localStorage.setItem('fintrack_data', JSON.stringify(txs));
                document.getElementById('form-tx').reset();
                if ("vibrate" in navigator) navigator.vibrate(100);
                updateUI();
            }
        }

        function deleteTx(id) {
            txs = txs.filter(tx => tx.id !== id);
            localStorage.setItem('fintrack_data', JSON.stringify(txs));
            updateUI();
        }

        function updateUI() {
            let inc = 0, exp = 0;
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = '';

            txs.slice().reverse().forEach(tx => {
                if (tx.type === 'income') inc += tx.amount; else exp += tx.amount;
                
                tbody.innerHTML += `
                    <tr class="border-b border-slate-700/30 hover:bg-slate-800/20 transition-colors text-white">
                        <td class="p-3">${tx.type === 'income' ? '<span class="text-emerald-400"><i class="fa-solid fa-arrow-down mr-1"></i>Masuk</span>' : '<span class="text-rose-400"><i class="fa-solid fa-arrow-up mr-1"></i>Keluar</span>'}</td>
                        <td class="p-3 font-medium">${tx.cat}</td>
                        <td class="p-3 font-mono font-bold ${tx.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">${fmtRp(tx.amount)}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteTx(${tx.id})" class="text-rose-500 hover:text-rose-400 cursor-pointer p-1"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('val-balance').innerText = fmtRp(inc - exp);
            document.getElementById('val-income').innerText = `+ ${fmtRp(inc)}`;
            document.getElementById('val-expense').innerText = `- ${fmtRp(exp)}`;

            initChart(inc, exp);

            const limit = parseInt(localStorage.getItem('fintrack_budget')) || 0;
            const expCard = document.getElementById('card-expense');
            if (limit > 0 && exp > limit) expCard.classList.add('budget-alert');
            else expCard.classList.remove('budget-alert');
        }

        document.body.className = localStorage.getItem('fintrack_theme') || 'theme-cyber min-h-screen antialiased';
        document.getElementById('input-budget').value = localStorage.getItem('fintrack_budget') || '';
        updateUI();
    </script>
</body>
</html>
